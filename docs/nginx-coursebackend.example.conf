# coursebackend.oilandgasclub.com — proxy to Docker Elearn.Serverless (host PORT, default 7085)
# If you see 504 on /api/public/*, increase timeouts and ensure the backend container is healthy:
#   curl -sS https://coursebackend.oilandgasclub.com/api/health

upstream coursebackend_api {
  server 127.0.0.1:7085;
  keepalive 16;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name coursebackend.oilandgasclub.com;

  location / {
    proxy_pass http://coursebackend_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forward_for;
    proxy_connect_timeout 15s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
  }
}
